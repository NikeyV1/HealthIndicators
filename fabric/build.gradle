plugins {
    id 'com.gradleup.shadow'
}

architectury {
    platformSetupLoomIde()
    fabric()
}

loom {
    accessWidenerPath = file("src/main/resources/healthindicators.accesswidener")
}

configurations {
    common {
        canBeResolved = true
        canBeConsumed = false
    }
    compileClasspath.extendsFrom common
    runtimeClasspath.extendsFrom common
    developmentFabric.extendsFrom common

    // Files in this configuration will be bundled into your mod using the Shadow plugin.
    // Don't use the `shadow` configuration from the plugin itself as it's meant for excluding files.
    shadowBundle {
        canBeResolved = true
        canBeConsumed = false
    }
}

// Non-obfuscated MC 26.1+: Loom 1.15+ / Architectury Loom 1.17+ no longer remaps.
// modImplementation → implementation for regular deps (no remapping occurs).
// fabric-loader and architectury-fabric kept as modImplementation for Architectury's transform pipeline.
dependencies {
    modImplementation "net.fabricmc:fabric-loader:$project.fabric_loader_version"
    // Fabric API. This is technically optional, but you probably want it anyway.
    implementation "net.fabricmc.fabric-api:fabric-api:$project.fabric_api_version"
    // Architectury API. This is optional, and you can comment it out if you don't need it.
    modImplementation "dev.architectury:architectury-fabric:$project.architectury_api_version"
    annotationProcessor 'org.spongepowered:mixin:0.8.5:processor'

    implementation "net.fabricmc.fabric-api:fabric-api:$rootProject.fabric_api_version"
    compileOnly "com.terraformersmc:modmenu:${project.modmenu}"
    implementation "dev.isxander:yet-another-config-lib:${project.yacl_fabric}"

    common(project(path: ':common', configuration: 'namedElements')) { transitive false }
    shadowBundle project(path: ':common', configuration: 'transformProductionFabric')
}

processResources {
    inputs.property 'version', project.version

    filesMatching('fabric.mod.json') {
        expand version: project.version
    }
}

shadowJar {
    configurations = [project.configurations.shadowBundle]
    archiveClassifier = 'dev-shadow'
}

// Non-obfuscated: no remapJar task. Shadow output is the final jar.
jar {
    dependsOn shadowJar
}
