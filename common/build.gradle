architectury {
    common rootProject.enabled_platforms.split(',')
}

repositories {
    maven{
        name 'Xander Maven'
        url 'https://maven.isxander.dev/releases'
    }
    maven { url "https://maven.terraformersmc.com/releases/" }
    maven { url 'https://oss.sonatype.org/content/repositories/snapshots' }
    maven { url 'https://repo.spongepowered.org/repository/maven-public/' }
}

dependencies {
    // Fabric Loader: kept as modImplementation — Architectury Loom uses this for @Environment
    // annotation cross-platform transform even in non-obfuscated mode. Do NOT use other classes.
    modImplementation "net.fabricmc:fabric-loader:$rootProject.fabric_loader_version"

    // Architectury API: kept as modImplementation for Architectury's namedElements transform pipeline.
    modImplementation "dev.architectury:architectury:$rootProject.architectury_api_version"
    implementation "dev.isxander:yet-another-config-lib:${project.yacl_fabric}"
    annotationProcessor 'org.spongepowered:mixin:0.8.5:processor'
    compileOnly "com.terraformersmc:modmenu:${project.modmenu}"
}

loom {
    accessWidenerPath = file("src/main/resources/healthindicators.accesswidener")
}

// Completely disable incremental compilation
/* tasks.withType(JavaCompile) {
    options.incremental = false
    doNotTrackState("Avoiding OneDrive sync issues")
    outputs.upToDateWhen { false }
} */

// Force clean compile
/* compileJava {
    dependsOn 'clean'
