plugins {
    // Minecraft 26.1+ ships non-obfuscated, so the architectury "no-remap" loom variant
    // is used (still architectury-loom, NOT net.fabricmc.fabric-loom).
    id 'dev.architectury.loom-no-remap' version '1.17.483' apply false
    id 'architectury-plugin' version '3.5.169'
    id 'com.gradleup.shadow' version '9.2.2' apply false
    id 'io.github.pacifistmc.forgix' version '2.0.0-SNAPSHOT.5.1'
}

architectury {
    minecraft = project.minecraft_version
}

forgix {
    destinationDirectory = layout.buildDirectory.dir("merged")
    archiveClassifier = ""
    archiveVersion = rootProject.mod_version

    fabric()
    neoforge()
}

// Ensure the per-platform jars exist before Forgix scans build/libs to merge them.
tasks.named("mergeJars") {
    dependsOn ":fabric:shadowJar", ":neoforge:shadowJar"
}

allprojects {
    group = rootProject.maven_group
    version = rootProject.mod_version
}

subprojects {
    apply plugin: 'dev.architectury.loom-no-remap'
    apply plugin: 'architectury-plugin'
    apply plugin: 'maven-publish'

    base {
        // Set up a suffixed format for the mod jar names, e.g. `example-fabric`.
        archivesName = "$rootProject.archives_name-$project.name"
    }

    repositories {
        maven { url "https://maven.terraformersmc.com/releases/"}
        maven { url "https://api.modrinth.com/maven" }
        maven { url 'https://repo.spongepowered.org/repository/maven-public/' }
    }

    dependencies {
        // No mappings line: Minecraft 26.1+ is non-obfuscated (official Mojang names in the jar).
        minecraft "com.mojang:minecraft:$rootProject.minecraft_version"
        annotationProcessor 'org.spongepowered:mixin:0.8.7:processor'
    }

    java {
        // Loom will automatically attach sourcesJar to a RemapSourcesJar task and to the "build" task
        // if it is present.
        // If you remove this line, sources will not be generated.
        withSourcesJar()

        sourceCompatibility = JavaVersion.VERSION_25
        targetCompatibility = JavaVersion.VERSION_25
    }

    tasks.withType(JavaCompile).configureEach {
        it.options.encoding = "UTF-8"
        it.options.release = 25
    }

    // Configure Maven publishing.
    publishing {
        publications {
            mavenJava(MavenPublication) {
                artifactId = base.archivesName.get()
                from components.java
            }
        }

        repositories {
            // Add repositories to publish to here.
        }
    }
}
