# Done to increase the memory available to Gradle.
org.gradle.jvmargs=-Xmx2G
org.gradle.parallel=true

# Mod properties
mod_version = 26.2.0
maven_group = io.github.adytech99.healthindicators
archives_name = HealthIndicators
enabled_platforms = fabric,neoforge

# Minecraft properties
# 26.2 is non-obfuscated; no mappings line needed (see build.gradle). Yarn is gone.
# Manifest release id is exactly "26.2" (per minecraft.wiki/Java_Edition_26.2, released 2026-06-16).
# "Failed to find official mojang mappings for 26.2" = ProGuard file doesn't exist for non-obfuscated;
# fix is removing officialMojangMappings() from build.gradle, NOT changing this version string.
minecraft_version=26.2

# Toolchain (verified against fabricmc.net/2026/06/15/262.html: Loom 1.17 / Gradle 9.5.1 / Java 25).
# Architectury Loom 1.17.477 is the first 1.17-line build (mvnrepository dev.architectury, 2026-06-09).
architectury_loom_version = 1.17.477

# Dependencies
# architectury_api 21.0.2 verified for 26.2 (Fabric + NeoForge).
architectury_api_version = 21.0.2
fabric_loader_version = 0.19.3
fabric_api_version=0.152.2+26.2
# TODO[26.2-verify]: confirm final (non-beta) NeoForge 26.2 build; 26.2.0.6-beta was latest seen.
neoforge_version = 26.2.0.6-beta
# TODO[26.2-verify]: confirm exact YACL +26.2 artifact strings (3.9.4 was latest for 26.1 / 26.2-pre).
yacl_fabric=3.9.4+26.2-fabric
yacl_neoforge=3.9.4+26.2-neoforge
# ModMenu 20.0.0-beta.3 verified for 26.2.
modmenu = 20.0.0-beta.3
